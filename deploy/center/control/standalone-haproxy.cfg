global
  log stdout format raw local0
  maxconn 1024
  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  log global
  mode http
  timeout http-request 10s
  timeout connect 3s
  timeout client 60s
  timeout server 60s

frontend public_https
  bind :${public_port} ssl crt /etc/msmonitor/tls.pem alpn h2,http/1.1
  acl control path /api/v1/daemon/register /api/v1/daemon/heartbeat /api/v1/daemon/poll-commands /api/v1/daemon/ack /api/v1/daemon/submit-summary
  acl metrics_api path_beg /insert/ /select/
  http-request deny deny_status 404 unless control or metrics_api
  use_backend daemon_api if control
  default_backend metrics_auth

backend daemon_api
  server i8 ${control}

backend metrics_auth
  server vmauth ${auth}

frontend health
  bind ${gateway_health}
  monitor-uri /readyz
